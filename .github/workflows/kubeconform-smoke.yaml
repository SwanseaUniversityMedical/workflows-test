name: Kubeconform Smoke

# Exercises the kubeconform action directly, without going through the chart
# build chain, so the new code can be verified before any asset tags exist.
# Delete this workflow once the chart workflows themselves are pinned to
# released kubeconform tags.

on:
  pull_request:
    paths:
      - '.github/workflows/kubeconform-smoke.yaml'
      - '.github/kubeconform-test/**'
  push:
    branches:
      - 'test/kubeconform'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kubeconform-smoke:
    runs-on:
      labels: [ self-hosted, linux, x64 ]
      group: light
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: install helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: 'v3.15.1'

      # Renders nothing at all without --include-crds, so a pass here with a
      # non-zero resource count proves the flag is doing its job.
      - name: crds chart
        id: crds
        uses: SwanseaUniversityMedical/workflows/.github/actions/kubeconform@feat/kubeconform
        with:
          chart: charts/fizzbuzz-crds

      - name: assert crds chart validated a resource
        shell: bash
        run: |
          set -euo pipefail
          echo "result=$RESULT"
          echo "summary=$SUMMARY"
          if [[ "$RESULT" != 'success' ]]; then
            echo "::error::expected the crds chart to validate cleanly"
            exit 1
          fi
          if [[ "$SUMMARY" != *'Valid: 1'* ]]; then
            echo "::error::expected exactly 1 valid resource, --include-crds may not be applied"
            exit 1
          fi
        env:
          RESULT: ${{ steps.crds.outputs.result }}
          SUMMARY: ${{ steps.crds.outputs.summary-line }}

      - name: valid manifests
        id: good
        uses: SwanseaUniversityMedical/workflows/.github/actions/kubeconform@feat/kubeconform
        with:
          chart: charts/fizzbuzz
          enforce: "true"
          helm-template-args: '--values .github/kubeconform-test/good-values.yaml'

      # enforce defaults to false, so problems must be reported without failing.
      - name: invalid manifests are reported but not enforced
        id: warn
        uses: SwanseaUniversityMedical/workflows/.github/actions/kubeconform@feat/kubeconform
        with:
          chart: charts/fizzbuzz
          helm-template-args: '--values .github/kubeconform-test/bad-values.yaml'

      - name: assert warn mode did not fail the build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESULT" != 'issues' ]]; then
            echo "::error::expected result 'issues', got '$RESULT'"
            exit 1
          fi
        env:
          RESULT: ${{ steps.warn.outputs.result }}

      - name: invalid manifests are blocking when enforced
        id: enforced
        continue-on-error: true
        uses: SwanseaUniversityMedical/workflows/.github/actions/kubeconform@feat/kubeconform
        with:
          chart: charts/fizzbuzz
          enforce: "true"
          helm-template-args: '--values .github/kubeconform-test/bad-values.yaml'

      - name: assert enforced mode failed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != 'failure' ]]; then
            echo "::error::expected enforce=true to fail the step, outcome was '$OUTCOME'"
            exit 1
          fi
          echo "enforced mode failed as expected"
        env:
          OUTCOME: ${{ steps.enforced.outcome }}
